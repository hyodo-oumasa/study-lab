# main ブランチに push されたら VitePress サイトをビルドし、GitHub Pages に公開する。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも実行できるようにする
  workflow_dispatch:

# Pages へのデプロイに必要な最小限の権限
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重なった場合は、実行中のものを途中で止めずに後続を待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # VitePress は Git の履歴から各ページの最終更新日時を調べる。
          # 初期設定では最新の 1 件しか取得しないため、履歴をすべて取得する。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
