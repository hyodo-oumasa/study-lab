[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "study-lab-commit-stats"
version = "0.1.0"
description = "GitHub のコミット数を日ごと・週ごとに集計して JSON に書き出すツール"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
commit-stats = "commit_stats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["node_modules", "docs"]

[tool.ruff.lint]
# E/F: 基本的な誤り、I: import の並び順、B: バグになりやすい書き方、UP: 古い書き方
select = ["E", "F", "I", "B", "UP"]
